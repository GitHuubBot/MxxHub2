name: MxxHub
options:
  bundleIdPrefix: com.mexx
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO

targets:
  MxxHub:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MxxHub
        excludes:
          - Assets.xcassets
      - path: External/WineGlass/Sources
        excludes:
          - "**/*.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mexx.mexxbox
        PRODUCT_NAME: MxxHub
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MxxHub
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SWIFT_OBJC_BRIDGING_HEADER: MxxHub/RuntimeBridge/MxxHub-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: c11
        OTHER_CFLAGS: "-DTARGET_OS_IOS=1 -D_DARWIN_C_SOURCE"
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/MxxHub/RuntimeBridge
          - $(SRCROOT)/External/WineGlass/Sources/Core
          - $(SRCROOT)/External/WineGlass/Sources/PE
          - $(SRCROOT)/External/WineGlass/Sources/CPU
          - $(SRCROOT)/External/WineGlass/Sources/Memory
          - $(SRCROOT)/External/WineGlass/Sources/Win32
          - $(SRCROOT)/External/WineGlass/Sources/LZMA
          - $(SRCROOT)/External/WineGlass/Sources/Graphics
          - $(SRCROOT)/External/WineGlass/Sources/App
          - $(SRCROOT)/External/WineGlass/Vendor/blink/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/External/WineGlass/Vendor/blink/lib
        OTHER_LDFLAGS:
          - -lbz2
          - -lz
          - -lm
          - $(SRCROOT)/External/WineGlass/Vendor/blink/lib/wg_blink_impl.o
          - $(SRCROOT)/External/WineGlass/Vendor/blink/lib/blink.a
          - -Xlinker
          - -undefined
          - -Xlinker
          - dynamic_lookup
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: Security.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: UniformTypeIdentifiers.framework
    scheme:
      gatherCoverageData: false
