name: Build MexxBox iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project MexxBox.xcodeproj \
            -scheme MexxBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_VERSION=5.9 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build | tee xcodebuild.log

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MexxBox-build-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/MexxBox.app Payload/
          zip -qry MexxBox-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MexxBox-unsigned-ipa
          path: MexxBox-unsigned.ipa
