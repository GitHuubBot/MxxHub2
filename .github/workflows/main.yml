name: Build MxxHub iOS v0.3.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout MxxHub
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen make

      - name: Prepare WineGlass + Blink runtime
        run: bash Scripts/prepare_wineglass.sh

      - name: Verify runtime files
        run: |
          test -d External/WineGlass/Sources
          test -f External/WineGlass/Vendor/blink/lib/blink.a
          test -f External/WineGlass/Vendor/blink/lib/wg_blink_impl.o
          cat External/UPSTREAM_VERSIONS.txt

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project MxxHub.xcodeproj \
            -scheme MxxHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_VERSION=5.9 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build | tee xcodebuild.log

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MxxHub-v0.3.1-build-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/MxxHub.app Payload/
          zip -qry MxxHub-v0.3.1-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MxxHub-v0.3.1-unsigned-ipa
          path: MxxHub-v0.3.1-unsigned.ipa
